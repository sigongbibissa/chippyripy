<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>About - Portfolio</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #ffffff;
            font-family: 'Times New Roman', serif;
            overflow: hidden;
        }

        .logo-container {
            position: fixed; top: 40px; left: 40px;
            z-index: 1000; opacity: 0;
            transition: opacity 0.6s ease;
        }
        .main-logo { width: 60px; height: auto; cursor: pointer; }

        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 2000; background-color: #ffffff;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .loading-wrap { display: flex; gap: 0; align-items: center; }
        .loading-wrap img { width: 150px; height: auto; margin: 0 -40px; opacity: 0; }

        .is-loading .loading-wrap img { animation: blink 1.2s infinite ease-in-out; }
        .is-complete .loading-overlay { opacity: 0; visibility: hidden; }
        .is-complete .logo-container { opacity: 1; }

        .content-container {
            width: 100%; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; transform: translateY(20px);
            transition: all 1s ease 0.3s;
        }
        .is-complete .content-container { opacity: 1; transform: translateY(0); }

        .about-text { max-width: 500px; text-align: center; }
        h1 { font-weight: normal; margin-bottom: 25px; font-size: 2rem; }
        p { line-height: 1.8; color: #333; }

        @keyframes blink { 0%, 100% { opacity: 0.1; } 50% { opacity: 1; } }
        .loading-wrap img:nth-child(1) { animation-delay: 0.0s; }
        .loading-wrap img:nth-child(2) { animation-delay: 0.2s; }
        .loading-wrap img:nth-child(3) { animation-delay: 0.4s; }
        .loading-wrap img:nth-child(4) { animation-delay: 0.6s; }
    </style>
</head>
<body class="is-loading">
    <div class="loading-overlay">
        <div class="loading-wrap">
            <img src="loading1.png" alt="L1"><img src="loading2.png" alt="L2">
            <img src="loading3.png" alt="L3"><img src="loading4.png" alt="L4">
        </div>
    </div>

    <div class="logo-container">
        <a href="index.html"><img src="logo.png" class="main-logo" alt="Logo"></a>
    </div>

    <div class="content-container">
        <article class="about-text">
            <p>
                김태민 입니다.<br>
                <br>
                
            </p>
        </article>
    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.body.classList.replace('is-loading', 'is-complete');
            }, 1500);
        });
    </script>
</body>

</html>
