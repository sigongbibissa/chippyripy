<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main - Interactive Menu</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Noto+Serif+KR:wght@400;700&display=swap');

        :root {
            --reveal-speed: 1s;
            --infinite-speed: 1.2s; 
            --accent-color: #ff3c00;
            --main-font: "EB Garamond", "Noto Serif KR", serif;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #ffffff;
            font-family: var(--main-font); 
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .page-wrapper { width: 100%; height: 100%; position: relative; }

        /* --- 로고 --- */
        .logo-container {
            position: absolute; top: 40px; left: 40px; z-index: 1000;
            transition: transform 0.3s ease-out, opacity 0.3s ease;
        }
        .main-logo { 
            width: 60px; height: auto; opacity: 0;
            animation: logoReveal 0.8s ease forwards;
        }

        /* --- 🔥 저작권 문구 (추가됨) --- */
        .copyright {
            position: absolute; top: 20px; right: 40px; z-index: 1000;
            font-size: 0.75rem; color: #999; letter-spacing: 0.05em;
            opacity: 0;
            animation: itemAppear 0.8s ease forwards 1.2s; /* 다른 요소들보다 살짝 늦게 등장 */
            transition: transform 0.3s ease-out, opacity 0.3s ease;
        }

        /* --- 메인 메뉴 --- */
        .main-menu { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 50; }
        .menu-item {
            position: absolute; text-decoration: none; color: #1a1a1a; 
            font-size: 1.4rem; opacity: 0; display: inline-block;
            transition: opacity var(--reveal-speed) ease, transform 0.5s ease-out, color 0.2s ease;
            animation: itemAppear 0.8s ease forwards;
            letter-spacing: -0.02em;
        }
        .menu-item.portfolio { left: 35%; top: 45%; animation-delay: 0.2s; }
        .menu-item.shop { right: 30%; top: 25%; animation-delay: 0.4s; }
        .menu-item.about { right: 25%; bottom: 20%; animation-delay: 0.6s; }

        /* --- 현실도피하기 버튼 --- */
        .minigame-btn {
            position: absolute; bottom: 40px; left: 40px; z-index: 1000;
            text-decoration: none; color: #000; font-size: 1.1rem;
            font-weight: 500; font-style: italic; opacity: 0;
            transition: all 0.3s ease;
            animation: itemAppear 0.8s ease forwards 1s;
        }

        .minigame-btn:hover { color: var(--accent-color); transform: scale(1.1); }

        /* --- 기존 인터랙션 (:has) --- */
        /* 메뉴 호버 시 저작권 문구도 살짝 투명해지도록 추가 */
        .page-wrapper:has(.menu-item:hover) .logo-container,
        .page-wrapper:has(.menu-item:hover) .copyright {
            transform: scale(0.9);
            animation: tremble 0.07s infinite;
            opacity: 0.3;
        }
        
        .page-wrapper:has(.menu-item:hover) .minigame-btn {
            opacity: 0.15; transform: translateX(-20px); pointer-events: none;
        }
        .page-wrapper:has(.menu-item:hover) .menu-item:not(:hover) { 
            opacity: 0.1; animation: tremble 0.07s infinite; 
        }
        .page-wrapper:has(.menu-item:hover) .menu-item.shop:not(:hover) { transform: translateX(-80px); }
        .page-wrapper:has(.menu-item:hover) .menu-item.portfolio:not(:hover) { transform: translate(80px, -80px); }
        .page-wrapper:has(.menu-item:hover) .menu-item.about:not(:hover) { transform: translate(80px, 80px); }

        .menu-item:hover { 
            animation: infiniteRotate var(--infinite-speed) linear infinite !important; 
            opacity: 1 !important; 
        }

        /* --- 이스터에그: 우수수 떨어지는 효과 --- */
        .fall-down {
            pointer-events: none !important;
            transform: translateY(110vh) rotate(var(--fall-rotate, 20deg)) !important;
            opacity: 0 !important;
            transition: transform 2s cubic-bezier(0.5, 0, 1, 0.5), opacity 1.5s !important;
        }

        /* 애니메이션 정의 */
        @keyframes logoReveal { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes itemAppear { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes tremble { 0% { margin: 1px 1px; } 50% { margin: -1px -1px; } 100% { margin: 1px 1px; } }
        @keyframes infiniteRotate { from { transform: rotate(0deg) scale(1.4); } to { transform: rotate(360deg) scale(1.4); } }
    </style>
</head>
<body>

    <div class="page-wrapper" id="wrapper">
        <div class="logo-container" id="logo-box">
            <img src="logo.png" class="main-logo" alt="LOGO" onerror="this.style.display='none'; this.parentElement.innerHTML='LOGO';">
        </div>

        <div class="copyright">
            Copyright 2026. TaeminKim All rights reserved.
        </div>

        <nav class="main-menu">
            <a href="shop.html" class="menu-item shop">Shop</a>
            <a href="portfolio.html" class="menu-item portfolio">Portfolio</a>
            <a href="about.html" class="menu-item about">About</a>
        </nav>

        <a href="minigame.html" class="minigame-btn" id="escape-btn">현실도피하기</a>
    </div>

    <script>
        let idleTimer;
        const idleLimit = 10000; // 10초

        function triggerEasterEgg() {
            // 떨어뜨릴 모든 요소 선택 (.copyright 추가됨)
            const targets = document.querySelectorAll('.menu-item, .logo-container, .minigame-btn, .copyright');
            
            targets.forEach((el, index) => {
                const randomDeg = Math.floor(Math.random() * 60) - 30; 
                el.style.setProperty('--fall-rotate', `${randomDeg}deg`);

                setTimeout(() => {
                    el.classList.add('fall-down');
                }, index * 150);
            });
        }

        function resetTimer() {
            const fallen = document.querySelectorAll('.fall-down');
            if (fallen.length > 0) {
                fallen.forEach(el => el.classList.remove('fall-down'));
            }

            clearTimeout(idleTimer);
            idleTimer = setTimeout(triggerEasterEgg, idleLimit);
        }

        ['mousemove', 'mousedown', 'keydown', 'touchstart'].forEach(type => {
            window.addEventListener(type, resetTimer);
        });

        resetTimer();
    </script>
</body>
</html>
