<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>The Reality of Designer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');

        :root { 
            --main-font: "EB Garamond", "Noto Sans KR", sans-serif; 
            --accent-color: #ff3c00; 
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #ffffff; font-family: var(--main-font); 
            overflow: hidden; touch-action: none;
        }
        
        /* 시작 화면 */
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 500;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer;
        }
        #start-screen h2 {
            font-size: 1.8rem; font-weight: 700; color: #000;
            letter-spacing: -0.05em; margin-bottom: 10px;
        }
        #start-screen p { color: #999; font-style: italic; }

        .info-bar { 
            position: absolute; top: 25px; left: 25px; right: 25px; 
            display: flex; justify-content: space-between; align-items: center; 
            z-index: 100; pointer-events: none; opacity: 0; transition: opacity 0.5s;
        }
        .score-box { font-size: 1.3rem; color: #000; font-weight: 700; }
        
        .enemy { 
            position: absolute; color: #000; font-size: 1.3rem; 
            white-space: nowrap; user-select: none; 
            font-weight: 700; letter-spacing: -0.05em;
            cursor: pointer; padding: 15px; will-change: transform;
        }
        
        #game-over { 
            display: none; position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); text-align: center; 
            z-index: 200; background: rgba(255,255,255,0.98); 
            padding: 40px 30px; border: 2px solid #000; width: 85%; max-width: 400px;
        }
        #game-over h1 { font-size: 2.2rem; margin: 0 0 15px 0; color: var(--accent-color); font-weight: 800; }
        #game-over button { 
            background: #000; color: #fff; border: none; 
            padding: 15px 40px; font-family: var(--main-font); 
            font-size: 1.1rem; cursor: pointer; font-weight: 600;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); }
        }
        .shake { animation: shake 0.4s; }
    </style>
</head>
<body>

    <div id="start-screen" onclick="initGame()">
        <h2>터치해서 현실을 도피하세요</h2>
        <p>(마우스 클릭 또는 화면 터치)</p>
    </div>

    <div class="info-bar" id="info-bar">
        <div class="score-box" id="mode-text">생존 시간: <span id="score-val">0</span></div>
    </div>

    <div id="game-container"></div>

    <div id="game-over">
        <h1 id="over-title">결국 잡혔습니다.</h1>
        <p id="over-msg">당신은 현실로부터 <span id="final-score">0</span>초 동안 도망쳤습니다.</p>
        <button onclick="location.reload()">다시 도피하기</button>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const scoreVal = document.getElementById('score-val');
        const gameOverScreen = document.getElementById('game-over');
        const infoBar = document.getElementById('info-bar');
        const startScreen = document.getElementById('start-screen');

        let isGameOver = false;
        let score = 0;
        let startTime;
        let enemies = [];
        const words = ["운동 해야지", "취업 해야지", "도면 쳐야지", "모형 만들어야지", "설계 해야지", "컨펌 받아야지", "수정 해야지"];
        const isMobile = window.innerWidth <= 768;

        function initGame() {
            startScreen.style.display = 'none';
            infoBar.style.opacity = '1';
            startTime = Date.now();

            if (isMobile) {
                document.getElementById('mode-text').innerHTML = "해결한 업무: <span id='score-val'>0</span>";
                startMobileGame();
            } else {
                document.getElementById('mode-text').innerHTML = "생존 시간: <span id='score-val'>0.0</span>s";
                startDesktopGame();
            }
        }

        function endGame(title, msg) {
            if(isGameOver) return;
            isGameOver = true;
            gameOverScreen.style.display = 'block';
            document.body.classList.add('shake');
            document.getElementById('over-title').innerText = title;
            document.getElementById('over-msg').innerText = msg;
            document.body.style.backgroundColor = "#ffefed";
        }

        // --- 1. 모바일 (속도 유지) ---
        function startMobileGame() {
            function spawnTask() {
                if (isGameOver) return;
                const task = document.createElement('div');
                task.classList.add('enemy');
                task.innerText = words[Math.floor(Math.random() * words.length)];
                task.style.left = `${Math.random() * (window.innerWidth - 140) + 20}px`;
                task.style.top = `-60px`;
                container.appendChild(task);
                const taskObj = { el: task, y: -60, speed: 5.5 + (score * 0.35) };
                task.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    score++;
                    document.getElementById('score-val').innerText = score;
                    task.style.color = "var(--accent-color)";
                    setTimeout(() => task.remove(), 40);
                    enemies = enemies.filter(t => t !== taskObj);
                });
                enemies.push(taskObj);
                setTimeout(spawnTask, Math.max(150, 650 - (score * 40)));
            }
            function mobileLoop() {
                if (isGameOver) return;
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const task = enemies[i];
                    task.y += task.speed;
                    task.el.style.transform = `translateY(${task.y}px)`;
                    if (task.y > window.innerHeight - 70) endGame("마감 기한 초과", `총 ${score}개의 업무를 처리했습니다.`);
                }
                requestAnimationFrame(mobileLoop);
            }
            spawnTask(); mobileLoop();
        }

        // --- 2. 데스크톱 (밸런스 수정) ---
        function startDesktopGame() {
            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;
            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            function spawnEnemy() {
                if (isGameOver) return;
                const enemy = document.createElement('div');
                enemy.classList.add('enemy');
                enemy.innerText = words[Math.floor(Math.random() * words.length)];
                
                const side = Math.floor(Math.random() * 4);
                let x, y;
                // 생성 거리를 더 멀리 (100 -> 200) 하여 갑자기 나타나지 않게 함
                if(side === 0) { x = Math.random() * window.innerWidth; y = -200; }
                else if(side === 1) { x = window.innerWidth + 200; y = Math.random() * window.innerHeight; }
                else if(side === 2) { x = Math.random() * window.innerWidth; y = window.innerHeight + 200; }
                else { x = -200; y = Math.random() * window.innerHeight; }

                container.appendChild(enemy);
                // 초기 속도 낮춤 (5 -> 2.5) / 가속도 낮춤 (0.45 -> 0.15)
                enemies.push({ el: enemy, x: x, y: y, baseSpeed: Math.random() * 1.5 + 2.5, accel: 0.15 });
                
                // 생성 주기를 조금 더 여유있게 (600 -> 1000)
                setTimeout(spawnEnemy, Math.max(200, 1000 - (score * 30)));
            }

            function desktopLoop() {
                if (isGameOver) return;
                score = ((Date.now() - startTime) / 1000).toFixed(1);
                document.getElementById('score-val').innerText = score;
                enemies.forEach((en) => {
                    const dx = mouseX - en.x;
                    const dy = mouseY - en.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    // 초반 추격 속도 완만하게 계산
                    let currentSpeed = en.baseSpeed + (parseFloat(score) * en.accel);
                    
                    // 근접 보너스 축소 (1.7 -> 1.3)
                    if (dist < 200) currentSpeed *= 1.3;

                    en.x += (dx / dist) * currentSpeed;
                    en.y += (dy / dist) * currentSpeed;
                    en.el.style.transform = `translate(${en.x}px, ${en.y}px)`;

                    // 충돌 판정 여유 (45 -> 35)
                    if (dist < 35) endGame("결국 잡혔습니다.", `현실로부터 ${score}초 동안 도망쳤습니다.`);
                });
                requestAnimationFrame(desktopLoop);
            }
            spawnEnemy(); desktopLoop();
        }
    </script>
</body>
</html>
