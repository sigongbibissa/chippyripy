<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Reality of Designer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap');
        
        /* 한국어 폰트 가독성을 위해 본고딕 계열 추가 */
        :root { 
            --main-font: "EB Garamond", "Noto Sans KR", sans-serif; 
            --accent-color: #ff3c00; 
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #ffffff; font-family: var(--main-font); 
            overflow: hidden; cursor: crosshair; 
        }
        
        .info-bar { 
            position: absolute; top: 30px; left: 40px; right: 40px; 
            display: flex; justify-content: space-between; align-items: center; 
            z-index: 100; pointer-events: none; 
        }
        .score-box { font-size: 1.5rem; color: #000; font-weight: 600; }
        .back-link { 
            text-decoration: none; color: #999; font-size: 1rem; 
            font-style: italic; pointer-events: auto; transition: color 0.3s; 
        }
        .back-link:hover { color: var(--accent-color); }
        
        .enemy { 
            position: absolute; color: #000; font-size: 1.3rem; 
            white-space: nowrap; user-select: none; pointer-events: none; 
            will-change: transform; font-weight: 700; letter-spacing: -0.05em;
        }
        
        #game-over { 
            display: none; position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); text-align: center; 
            z-index: 200; background: rgba(255,255,255,0.98); 
            padding: 50px; border: 2px solid #000; 
        }
        #game-over h1 { font-size: 3.5rem; margin: 0 0 10px 0; color: var(--accent-color); }
        #game-over p { font-size: 1.2rem; margin-bottom: 30px; }
        #game-over button { 
            background: #000; color: #fff; border: none; 
            padding: 15px 40px; font-family: var(--main-font); 
            font-size: 1.1rem; cursor: pointer; 
        }
        #game-over button:hover { background: var(--accent-color); }
    </style>
</head>
<body>

    <div class="info-bar">
        <div class="score-box">생존 시간: <span id="score-val">0.0</span>s</div>
        <a href="index.html" class="back-link">← 탈출하기</a>
    </div>

    <div id="game-container"></div>

    <div id="game-over">
        <h1>결국 잡혔습니다.</h1>
        <p>당신은 현실로부터 <span id="final-score">0</span>초 동안 도망쳤습니다.</p>
        <button onclick="location.reload()">다시 밤새기</button>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const scoreVal = document.getElementById('score-val');
        const gameOverScreen = document.getElementById('game-over');
        const finalScore = document.getElementById('final-score');

        let isGameOver = false;
        let score = 0;
        let startTime = Date.now();
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let enemies = [];

        // ==========================================
        // ✍️ 요청하신 문구들로 수정 완료!
        // ==========================================
        const words = [
            "밤새야지",
            "취업해야지",
            "도면 쳐야지",
            "모형만들어야지",
            "설계 해야지"
        ];
        // ==========================================

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function spawnEnemy() {
            if (isGameOver) return;
            const enemy = document.createElement('div');
            enemy.classList.add('enemy');
            enemy.innerText = words[Math.floor(Math.random() * words.length)];
            
            const side = Math.floor(Math.random() * 4);
            let x, y;
            const offset = 150;
            if(side === 0) { x = Math.random() * window.innerWidth; y = -offset; }
            else if(side === 1) { x = window.innerWidth + offset; y = Math.random() * window.innerHeight; }
            else if(side === 2) { x = Math.random() * window.innerWidth; y = window.innerHeight + offset; }
            else { x = -offset; y = Math.random() * window.innerHeight; }

            enemy.style.left = `0px`; enemy.style.top = `0px`;
            container.appendChild(enemy);

            enemies.push({
                el: enemy, x: x, y: y,
                baseSpeed: Math.random() * 2 + 5, // 기본 속도 상향
                accel: 0.4 // 가속도 상향
            });
        }

        function gameLoop() {
            if (isGameOver) return;
            score = ((Date.now() - startTime) / 1000).toFixed(1);
            scoreVal.innerText = score;

            enemies.forEach((en) => {
                const dx = mouseX - en.x;
                const dy = mouseY - en.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                let currentSpeed = en.baseSpeed + (score * en.accel);
                
                if (dist < 200) {
                    currentSpeed *= 1.6; // 근접 시 더 빠르게 돌진
                    en.el.style.color = "#ff3c00";
                } else {
                    en.el.style.color = "#000";
                }

                const vx = (dx / dist) * currentSpeed;
                const vy = (dy / dist) * currentSpeed;

                en.x += vx; en.y += vy;
                en.el.style.transform = `translate(${en.x}px, ${en.y}px)`;

                // 충돌 판정 (한글은 폭이 넓어 45 정도로 설정)
                if (dist < 45) endGame();
            });
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            isGameOver = true;
            gameOverScreen.style.display = 'block';
            finalScore.innerText = score;
            document.body.style.backgroundColor = "#ffefed";
        }

        let spawnRate = 700;
        function adaptiveSpawn() {
            if (isGameOver) return;
            spawnEnemy();
            spawnRate = Math.max(120, 700 - (score * 60)); 
            setTimeout(adaptiveSpawn, spawnRate);
        }

        adaptiveSpawn();
        gameLoop();
    </script>
</body>
</html>
