<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Portfolio - Work Snap</title>
    <style>
        :root {
            --reveal-speed: 1s;
            --page-transition: 0.8s;
            --accent-color: #1a1a1a;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #ffffff;
            font-family: 'Garamond', serif;
            overflow-y: auto; overflow-x: hidden;
            -webkit-user-select: none; user-select: none;
            -webkit-touch-callout: none;
        }

        img { -webkit-user-drag: none; user-drag: none; pointer-events: none; }

        /* --- 상단 내비게이션 구조 수정 --- */
        .header-nav {
            position: fixed;
            top: 40px;
            left: 0;
            width: 100%;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.6s ease 0.5s;
            display: flex;
            flex-direction: column; /* 요소를 세로로 층을 나눔 */
            align-items: center;
        }
        .is-complete .header-nav { opacity: 1; }

        /* 로고와 메뉴가 있는 상단 라인 */
        .nav-top-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            box-sizing: border-box;
        }

        /* 스위치가 위치하는 하단 라인 (한 칸 내림) */
        .nav-bottom-row {
            margin-top: 30px; /* 상단 메뉴와의 간격 (한 칸 내림) */
            display: flex;
            justify-content: center;
        }

        .main-logo { width: 50px; height: auto; cursor: pointer; pointer-events: auto !important; }

        .filter-container { display: flex; gap: 20px; }
        .filter-btn {
            background: none; border: none;
            font-family: 'Garamond', serif; font-size: 0.65rem;
            letter-spacing: 0.15em; color: var(--accent-color);
            cursor: pointer; padding: 0; opacity: 0.4;
            transition: opacity 0.3s ease;
        }
        .filter-btn.active, .filter-btn:hover { opacity: 1; }

        /* --- 스위치 그래픽 (이전 디자인 + 상하 배치) --- */
        .view-switch-wrapper {
            display: flex; 
            flex-direction: column; /* 글자 아래 버튼 배치 */
            align-items: center; 
            gap: 8px; 
            cursor: pointer;
        }
        .switch-label {
            font-size: 0.65rem; 
            letter-spacing: 0.05em; 
            color: var(--accent-color);
            font-family: 'Garamond', serif;
            text-transform: capitalize;
        }
        .switch-track {
            width: 36px; 
            height: 18px; 
            background-color: #fff; 
            border: 2px solid #000; /* 검은색 테두리 그래픽 */
            border-radius: 20px; 
            position: relative; 
            transition: all 0.3s;
        }
        .switch-thumb {
            width: 12px; 
            height: 12px; 
            background-color: #000; /* 검은색 원형 버튼 */
            border-radius: 50%; 
            position: absolute; 
            top: 1px; /* 테두리 두께 고려하여 중앙 배치 */
            left: 3px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* 스위치 On 상태 */
        .view-switch-wrapper.on .switch-thumb { transform: translateX(18px); }

        /* --- 로딩 애니메이션 --- */
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 2000; background-color: #ffffff;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .loading-wrap { display: flex; gap: 0; align-items: center; }
        .loading-wrap img { width: 150px; height: auto; margin: 0 -40px; opacity: 0; }
        .is-loading .loading-wrap img { animation: wave 1.2s infinite ease-in-out; }
        @keyframes wave { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
        .loading-wrap img:nth-child(1) { animation-delay: 0.0s; }
        .loading-wrap img:nth-child(2) { animation-delay: 0.3s; }
        .loading-wrap img:nth-child(3) { animation-delay: 0.6s; }
        .loading-wrap img:nth-child(4) { animation-delay: 0.9s; }
        .is-complete .loading-overlay { opacity: 0; visibility: hidden; }

        /* --- 워크 컨테이너 (여백 조정) --- */
        .work-container {
            width: 100%; max-width: 1400px; margin: 0 auto;
            padding: 240px 40px 200px; /* 헤더가 내려왔으므로 상단 여백 추가 */
            box-sizing: border-box;
            display: grid; grid-template-columns: repeat(12, 1fr);
            gap: 160px 40px; opacity: 0; transform: translateY(30px);
            transition: opacity 1s ease 0.3s, transform 1s ease 0.3s;
        }
        .is-complete .work-container { opacity: 1; visibility: visible; transform: translateY(0); }

        .work-item { 
            display: flex; flex-direction: column; position: relative; cursor: pointer;
            transition: opacity 0.5s ease, transform 0.5s ease, visibility 0.5s;
        }
        .work-item a { text-decoration: none; color: inherit; display: contents; }
        .work-item.hidden {
            opacity: 0; visibility: hidden;
            transform: translateY(20px) scale(0.95);
            pointer-events: none; position: absolute;
        }

        .img-box { 
            width: 100%; background-color: #fcfcfc; margin-bottom: 15px; 
            overflow: hidden; position: relative;
        }
        .img-box img { 
            width: 100%; height: 100%; object-fit: cover; display: block; 
            transition: opacity 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .img-box img.hover-img { position: absolute; top: 0; left: 0; opacity: 0; }

        .work-item:hover .img-box img.main-img,
        .work-item.is-active .img-box img.main-img,
        .work-container.mode-preview .main-img { opacity: 0; }

        .work-item:hover .img-box img.hover-img,
        .work-item.is-active .img-box img.hover-img,
        .work-container.mode-preview .hover-img { opacity: 1; }

        .work-item h2 { 
            font-weight: normal; font-size: 0.55rem; letter-spacing: 0.2em; 
            color: #1a1a1a; margin: 0; text-align: center;
        }

        /* --- 그리드 배치 --- */
        .item-1 { grid-column: 3 / 7; margin-top: 40px; } .item-1 .img-box { aspect-ratio: 16 / 10; }
        .item-2 { grid-column: 9 / 12; margin-top: 70px; } .item-2 .img-box { aspect-ratio: 1 / 1; }
        .item-3 { grid-column: 2 / 6; margin-top: -90px; } .item-3 .img-box { aspect-ratio: 1 / 1; }
        .item-4 { grid-column: 8 / 11; margin-top: -30px; } .item-4 .img-box { aspect-ratio: 2 / 3; }
        .item-5 { grid-column: 3 / 9; margin-top: -30px; } .item-5 .img-box { aspect-ratio: 4 / 1.8; }
        .item-6 { grid-column: 7 / 12; margin-top: 40px; } .item-6 .img-box { aspect-ratio: 4 / 3; }

        /* 모바일 대응 */
        @media (max-width: 768px) {
            .header-nav { top: 20px; }
            .nav-top-row { padding: 0 20px; }
            .nav-bottom-row { margin-top: 20px; }
            .filter-btn { font-size: 0.5rem; letter-spacing: 0.05em; }
            .work-container { padding-top: 180px; gap: 80px 20px; }
        }
    </style>
</head>
<body class="is-loading" oncontextmenu="return false">

    <div class="loading-overlay">
        <div class="loading-wrap">
            <img src="loading1.png" alt="L1"><img src="loading2.png" alt="L2">
            <img src="loading3.png" alt="L3"><img src="loading4.png" alt="L4">
        </div>
    </div>

    <header class="header-nav">
        <div class="nav-top-row">
            <div class="nav-left">
                <a href="index.html"><img src="logo.png" class="main-logo" alt="Logo"></a>
            </div>
            <div class="nav-right">
                <div class="filter-container">
                    <button class="filter-btn active" data-filter="all">ALL</button>
                    <button class="filter-btn" data-filter="architecture">ARCHITECTURE</button>
                    <button class="filter-btn" data-filter="jewelry">JEWELRY</button>
                    <button class="filter-btn" data-filter="furniture">FURNITURE</button>
                </div>
            </div>
        </div>
        
        <div class="nav-bottom-row">
            <div class="view-switch-wrapper" id="view-toggle">
                <span class="switch-label">Preview</span>
                <div class="switch-track">
                    <div class="switch-thumb"></div>
                </div>
            </div>
        </div>
    </header>

    <div class="work-container" id="work-grid">
        <section class="work-item item-1" data-category="architecture">
            <a href="project01.html">
                <div class="img-box">
                    <img src="main.jpg" class="main-img" alt="Arco Art Library">
                    <img src="main_hover.jpg" class="hover-img" alt="Hover Image">
                </div>
                <h2>Arco Art Library-Architectural Renovation</h2>
            </a>
        </section>
        <section class="work-item item-2" data-category="furniture">
            <a href="project02.html">
                <div class="img-box">
                    <img src="LZ_main.jpg" class="main-img" alt="On the ceiling">
                    <img src="LZ_hover.jpg" class="hover-img" alt="Hover Image">
                </div>
                <h2>On the ceiling</h2>
            </a>
        </section>
        <section class="work-item item-3" data-category="jewelry">
            <a href="project03.html">
                <div class="img-box">
                    <img src="or_main.jpg" class="main-img" alt="Ornament is sublime">
                    <img src="or_hover.jpg" class="hover-img" alt="Hover Image">
                </div>
                <h2>Ornament is sublime</h2>
            </a>
        </section>
        <section class="work-item item-4" data-category="architecture">
            <a href="project04.html">
                <div class="img-box">
                    <img src="발명제안서 렌더 바탕 50투명도.png" class="main-img" alt="Sliding Library">
                    <img src="project04_hover.png" class="hover-img" alt="Hover Image">
                </div>
                <h2>Sliding Library</h2>
            </a>
        </section>
        <section class="work-item item-5" data-category="architecture">
            <a href="project05.html">
                <div class="img-box">
                    <img src="mainshot.jpg" class="main-img" alt="Suwon crafting village">
                    <img src="mainshot_hover.jpg" class="hover-img" alt="Hover Image">
                </div>
                <h2>Suwon crafting village</h2>
            </a>
        </section>
        <section class="work-item item-6" data-category="furniture">
            <a href="project06.html">
                <div class="img-box">
                    <img src="desk_main.jpg" class="main-img" alt="Minimalist Desk">
                    <img src="desk_hover.jpg" class="hover-img" alt="Hover Image">
                </div>
                <h2>06. MINIMALIST DESK</h2>
            </a>
        </section>
    </div>

    <script>
        window.addEventListener('load', function() {
            setTimeout(() => {
                document.body.classList.replace('is-loading', 'is-complete');
            }, 1500);
        });

        const filterBtns = document.querySelectorAll('.filter-btn');
        const workItems = document.querySelectorAll('.work-item');
        const workGrid = document.getElementById('work-grid');

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const filterValue = btn.getAttribute('data-filter').toLowerCase();

                workItems.forEach(item => {
                    const category = item.getAttribute('data-category').toLowerCase();
                    if (filterValue === 'all' || filterValue === category) {
                        item.classList.remove('hidden');
                    } else {
                        item.classList.add('hidden');
                    }
                });
            });
        });

        const viewToggle = document.getElementById('view-toggle');
        viewToggle.addEventListener('click', function() {
            this.classList.toggle('on');
            workGrid.classList.toggle('mode-preview');
        });

        workItems.forEach(item => {
            item.addEventListener('touchstart', function() {
                this.classList.add('is-active');
            }, {passive: true});
            item.addEventListener('touchend', function() {
                this.classList.remove('is-active');
            });
        });
    </script>
</body>
</html>
