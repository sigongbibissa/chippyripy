<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Portfolio - Work Snap</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">

    <style>
        :root {
            --reveal-speed: 1s;
            --page-transition: 0.8s;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #ffffff;
            font-family: 'EB Garamond', serif; 
            overflow-y: auto; overflow-x: hidden;
            -webkit-user-select: none; user-select: none;
        }

        img { -webkit-user-drag: none; user-drag: none; pointer-events: none; }

        /* --- 로고 및 로딩 --- */
        .logo-container {
            position: fixed; top: 40px; left: 40px; z-index: 1000;
            opacity: 0; transition: opacity 0.6s ease;
        }
        .main-logo { width: 50px; height: auto; cursor: pointer; pointer-events: auto !important; }

        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 2000; background-color: #ffffff;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .loading-wrap { display: flex; gap: 0; align-items: center; }
        .loading-wrap img { width: 150px; height: auto; margin: 0 -40px; opacity: 0; }
        .is-loading .loading-wrap img { animation: wave 1.2s infinite ease-in-out; }
        @keyframes wave { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
        .loading-wrap img:nth-child(1) { animation-delay: 0.0s; }
        .loading-wrap img:nth-child(2) { animation-delay: 0.3s; }
        .loading-wrap img:nth-child(3) { animation-delay: 0.6s; }
        .loading-wrap img:nth-child(4) { animation-delay: 0.9s; }
        .is-complete .loading-overlay { opacity: 0; visibility: hidden; }
        .is-complete .logo-container { opacity: 1; }

        /* --- 필터/소팅 UI --- */
        .filter-container {
            position: fixed; top: 45px; right: 40px; z-index: 1000;
            display: flex; gap: 20px; opacity: 0;
            transition: opacity 0.6s ease 0.5s;
        }
        .is-complete .filter-container { opacity: 1; }

        .filter-btn {
            background: none; border: none;
            font-family: 'EB Garamond', serif; 
            font-size: 0.65rem;
            letter-spacing: 0.15em; color: #1a1a1a;
            cursor: pointer; padding: 0; opacity: 0.4;
            transition: opacity 0.3s ease;
        }
        .filter-btn.active, .filter-btn:hover { opacity: 1; }

        /* --- 워크 컨테이너 수정 --- */
        .work-container {
            width: 100%; 
            max-width: 900px; /* 등간격 나열을 위해 컨테이너 폭 조정 */
            margin: 0 auto;
            padding: 200px 40px; 
            box-sizing: border-box;
            display: flex; 
            flex-direction: column; /* 세로로 나열 */
            gap: 150px; /* 아이템 사이의 일정한 간격 */
            opacity: 0; 
            transform: translateY(30px);
            transition: opacity 1s ease 0.3s, transform 1s ease 0.3s;
        }
        .is-complete .work-container { opacity: 1; visibility: visible; transform: translateY(0); }

        /* --- 워크 아이템 공통 --- */
        .work-item { 
            display: flex; flex-direction: column; position: relative; cursor: pointer;
            width: 100%;
            transition: opacity 0.5s ease, transform 0.5s ease, visibility 0.5s;
        }
        .work-item a { text-decoration: none; color: inherit; display: contents; }

        .work-item.hidden {
            display: none; /* 필터링 시 공간을 차지하지 않도록 수정 */
        }

        .img-box { 
            width: 100%; background-color: #f0f0f0; margin-bottom: 20px; 
            opacity: 1; overflow: hidden; position: relative;
            aspect-ratio: 16 / 10; /* 모든 이미지 박스 비율 통일 */
            transition: opacity 0.4s ease, transform 0.2s ease;
        }
        .img-box img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .work-item:hover .img-box { opacity: 0.7; }
        .work-item:active .img-box { transform: scale(1.02); opacity: 1; }

        .work-item h2 { 
            font-weight: normal; 
            font-size: 1rem; 
            letter-spacing: 0.15em; 
            line-height: 1.4;
            color: #1a1a1a; 
            margin: 0; 
            text-align: center;
            transition: all 0.4s ease;
        }

        /* 기존 개별 item-1 ~ item-9 위치 설정 코드 삭제됨 */
        
    </style>
</head>
<body class="is-loading" oncontextmenu="return false">

    <div class="loading-overlay">
        <div class="loading-wrap">
            <img src="loading1.png" alt="L1"><img src="loading2.png" alt="L2">
            <img src="loading3.png" alt="L3"><img src="loading4.png" alt="L4">
        </div>
    </div>

    <div class="filter-container">
        <button class="filter-btn active" data-filter="all">ALL</button>
        <button class="filter-btn" data-filter="architecture">ARCHITECTURE</button>
        <button class="filter-btn" data-filter="jewelry">JEWELRY</button>
        <button class="filter-btn" data-filter="furniture">FURNITURE</button>
        <button class="filter-btn" data-filter="ETC">ETC</button>
    </div>

    <div class="logo-container">
        <a href="index.html"><img src="logo.png" class="main-logo" alt="Logo"></a>
    </div>

    <div class="work-container">
       
        
        <section class="work-item item-8" data-category="architecture">
            <a href="project08.html">
                <div class="img-box"><img src="메인샷 신성한 파일.jpg" alt="The get lifted"></div>
                <h2>The get lifted</h2>
            </a>
        </section>

        <section class="work-item item-9" data-category="architecture">
            <a href="project09.html">
                <div class="img-box"><img src="Render24.jpg" alt="Docking House"></div>
                <h2>Docking House</h2>
            </a>
        </section>
        
        <section class="work-item item-1" data-category="architecture">
            <a href="project01.html">
                <div class="img-box"><img src="main.jpg" alt="Arco Art Library"></div>
                <h2>Arco Art Library-Architectural Renovation</h2>
            </a>
        </section>

        <section class="work-item item-2" data-category="furniture">
            <a href="project02.html">
                <div class="img-box"><img src="LZ_main.jpg" alt="On the ceiling"></div>
                <h2>On the ceiling</h2>
            </a>
        </section>

        <section class="work-item item-3" data-category="jewelry">
            <a href="project03.html">
                <div class="img-box"><img src="or_main.jpg" alt="Ornament is sublime"></div>
                <h2>Ornament is sublime</h2>
            </a>
        </section>

        <section class="work-item item-4" data-category="architecture">
            <a href="project04.html">
                <div class="img-box"><img src="발명제안서 렌더 바탕 50투명도.png" alt="Sliding Library"></div>
                <h2>Sliding Library</h2>
            </a>
        </section>

        <section class="work-item item-5" data-category="architecture">
            <a href="project05.html">
                <div class="img-box"><img src="mainshot.jpg" alt="Suwon crafting village"></div>
                <h2>Suwon crafting village</h2>
            </a>
        </section>

        <section class="work-item item-6" data-category="ETC">
            <a href="project06.html">
                <div class="img-box"><img src="head.jpg" alt="How to avoid the sun"></div>
                <h2>How to avoid the sun</h2>
            </a>
        </section>

        <section class="work-item item-7" data-category="architecture">
            <a href="project07.html">
                <div class="img-box"><img src="redner-MAIN.jpg" alt="Will you see me fly?"></div>
                <h2>Will you see me fly?</h2>
            </a>
        </section>



    </div>

    <script>
        window.addEventListener('load', function() {
            setTimeout(() => {
                document.body.classList.replace('is-loading', 'is-complete');
            }, 1500);
        });

        const filterBtns = document.querySelectorAll('.filter-btn');
        const workItems = document.querySelectorAll('.work-item');

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const filterValue = btn.getAttribute('data-filter').toLowerCase();

                workItems.forEach(item => {
                    const category = item.getAttribute('data-category').toLowerCase();
                    if (filterValue === 'all' || filterValue === category) {
                        item.classList.remove('hidden');
                    } else {
                        item.classList.add('hidden');
                    }
                });
            });
        });
    </script>
</body>
</html>
