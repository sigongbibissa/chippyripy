<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Product 01 - Detail</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            background-color: #ffffff;
            font-family: 'Times New Roman', serif;
        }
        
        /* 상단 헤더 */
        .header {
            position: fixed; top: 40px; left: 40px; right: 40px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000;
        }
        .main-logo { width: 60px; height: auto; }
        .back-btn { text-decoration: none; color: #000; font-size: 0.8rem; letter-spacing: 2px; border-bottom: 1px solid #000; padding-bottom: 2px; }

        /* 컨텐츠 */
        .detail-wrapper {
            padding: 140px 40px;
            max-width: 1200px; margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            opacity: 0; transform: translateY(20px);
            transition: all 1s ease;
        }
        .is-ready .detail-wrapper { opacity: 1; transform: translateY(0); }

        .detail-img { width: 100%; aspect-ratio: 1/1.2; background-color: #f4f4f4; }
        .detail-info h1 { font-size: 2rem; font-weight: normal; margin: 0 0 20px; }
        .detail-info p { line-height: 1.8; color: #555; font-size: 1rem; }

        @media (max-width: 768px) {
            .detail-wrapper { grid-template-columns: 1fr; padding: 100px 20px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html"><img src="logo.png" class="main-logo" alt="Logo"></a>
        <a href="shop.html" class="back-btn">BACK TO LIST</a>
    </div>

    <div class="detail-wrapper">
        <div class="detail-img">
            </div>
        <div class="detail-info">
            <h1>Product Item 01</h1>
            <p>여기에 상품 상세 설명을 입력하세요. <br><br>
               디자인 철학이나 사용된 기술, 브랜드 스토리를 적으면 포트폴리오의 완성도가 높아집니다.</p>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            document.body.classList.add('is-ready');
        });
    </script>
</body>
</html>
