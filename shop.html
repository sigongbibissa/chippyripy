<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Shop - Portfolio</title>
    <style>
        :root {
            --reveal-speed: 0.6s;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #ffffff;
            font-family: 'Times New Roman', serif;
            overflow-x: hidden; 
        }

        /* --- 1. 로딩 오버레이 --- */
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 2000; background-color: #ffffff;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .is-complete .loading-overlay { 
            opacity: 0; 
            visibility: hidden; 
            pointer-events: none;
        }

        .loading-wrap { display: flex; align-items: center; }
        .loading-wrap img { width: 150px; height: auto; margin: 0 -40px; opacity: 0; }
        @keyframes blink { 0%, 100% { opacity: 0.1; } 50% { opacity: 1; } }
        .is-loading .loading-wrap img { animation: blink 1.2s infinite ease-in-out; }
        .loading-wrap img:nth-child(1) { animation-delay: 0.0s; }
        .loading-wrap img:nth-child(2) { animation-delay: 0.2s; }
        .loading-wrap img:nth-child(3) { animation-delay: 0.4s; }
        .loading-wrap img:nth-child(4) { animation-delay: 0.6s; }

        /* --- 2. 로고 --- */
        .logo-container {
            position: fixed; top: 40px; left: 40px;
            z-index: 1000; opacity: 0;
            transition: opacity 0.6s ease;
        }
        .is-complete .logo-container { opacity: 1; }
        .main-logo { width: 60px; height: auto; }

        /* --- 3. 컨텐츠 영역 --- */
        .shop-container {
            padding: 140px 40px 80px;
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 60px 20px;
            opacity: 0; transform: translateY(20px);
            transition: all 1s ease 0.3s;
            max-width: 900px;
            margin: 0 auto;
        }
        .is-complete .shop-container { opacity: 1; transform: translateY(0); }

        /* --- 4. 상품 아이템 & 이미지 --- */
        .shop-item { 
            text-decoration: none; 
            color: inherit; 
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .img-box { 
            width: 80%; /* 박스 크기 조절 */
            aspect-ratio: 1; /* 정사각형 유지 */
            background-color: #f7f7f7; 
            margin-bottom: 15px; 
            overflow: hidden; /* 이미지가 넘치지 않게 */
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.4s ease;
        }

        /*  */
        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 비율 유지하며 꽉 채우기 */
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.4s ease;
        }

        .shop-item:hover .img-box img {
            transform: scale(1.08); /* 호버 시 약간 확대 */
            opacity: 0.85;
        }

        .shop-item p { 
            font-size: 0.8rem; 
            color: #111; 
            letter-spacing: 0.1em; 
            margin: 0;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .shop-item:hover p { 
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
