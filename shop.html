<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Shop - Portfolio</title>
    <style>
        :root {
            --reveal-speed: 0.6s;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #ffffff;
            font-family: 'Times New Roman', serif;
        }

        /* --- 1. 로딩 오버레이 --- */
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 2000; background-color: #ffffff;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .is-complete .loading-overlay { 
            opacity: 0; 
            visibility: hidden; 
            pointer-events: none;
        }

        .loading-wrap { display: flex; align-items: center; }
        .loading-wrap img { width: 150px; height: auto; margin: 0 -40px; opacity: 0; }
        @keyframes blink { 0%, 100% { opacity: 0.1; } 50% { opacity: 1; } }
        .is-loading .loading-wrap img { animation: blink 1.2s infinite ease-in-out; }
        .loading-wrap img:nth-child(1) { animation-delay: 0.0s; }
        .loading-wrap img:nth-child(2) { animation-delay: 0.2s; }
        .loading-wrap img:nth-child(3) { animation-delay: 0.4s; }
        .loading-wrap img:nth-child(4) { animation-delay: 0.6s; }

        /* --- 2. 로고 --- */
        .logo-container {
            position: fixed; top: 40px; left: 40px;
            z-index: 1000; opacity: 0;
            transition: opacity 0.6s ease;
        }
        .is-complete .logo-container { opacity: 1; }
        .main-logo { width: 60px; height: auto; }

        /* --- 3. 컨텐츠 영역 (그리드) --- */
        .shop-container {
            padding: 140px 40px 80px;
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 60px 20px; /* 텍스트 애니메이션 공간을 위해 세로 간격 조정 */
            opacity: 0; transform: translateY(20px);
            transition: all 1s ease 0.3s;
            max-width: 900px;
            margin: 0 auto;
        }
        .is-complete .shop-container { opacity: 1; transform: translateY(0); }

        /* --- 4. 상품 아이템 & 텍스트 애니메이션 --- */
        .shop-item { 
            text-decoration: none; 
            color: inherit; 
            display: flex;
            flex-direction: column;
            align-items: center; /* 가로 중앙 정렬 */
            text-align: center;
            position: relative;
        }

        .img-box { 
            width: 70%; 
            aspect-ratio: 1; 
            background-color: #f4f4f4; 
            margin-bottom: 15px; 
            transition: background-color 0.4s ease;
        }

        /* 호버 시 이미지 박스 색상 변경 */
        .shop-item:hover .img-box { 
            background-color: #e8e8e8; 
        }

        /* 텍스트 초기 상태: 투명하고 약간 아래에 위치 */
        .shop-item p { 
            font-size: 0.8rem; 
            color: #111; 
            letter-spacing: 0.1em; 
            margin: 0;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(10px); /* 중앙 축 아래에서 대기 */
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* 사각형에 호버했을 때 텍스트 나타남 */
        .shop-item:hover p { 
            opacity: 1;
            transform: translateY(0); /* 제자리(중앙 축 방향)로 올라옴 */
        }

        /* 모바일 반응형 */
        @media (max-width: 768px) {
            .shop-container { grid-template-columns: repeat(2, 1fr); padding: 100px 20px; }
            .logo-container { top: 20px; left: 20px; }
            .img-box { width: 85%; }
        }
    </style>
</head>
