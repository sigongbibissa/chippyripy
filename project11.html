<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Project - Detail</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #ffffff;
            font-family: 'Garamond', serif;
            overflow-y: auto; overflow-x: hidden;
            -webkit-user-select: none; user-select: none;
        }

        /* --- [수정] 로고만 남긴 헤더 영역 --- */
        .header-info {
            position: fixed; top: 40px; left: 40px; z-index: 1000;
            opacity: 0; transition: opacity 0.6s ease;
        }
        .main-logo { width: 50px; height: auto; cursor: pointer; display: block; }

        /* 로딩 애니메이션 (웨이브 효과 유지) */
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 2000; background-color: #ffffff;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .loading-wrap { display: flex; gap: 0; align-items: center; }
        .loading-wrap img { width: 150px; height: auto; margin: 0 -40px; opacity: 0; }
        .is-loading .loading-wrap img { animation: wave 1.2s infinite ease-in-out; }
        @keyframes wave { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
        .loading-wrap img:nth-child(1) { animation-delay: 0.0s; }
        .loading-wrap img:nth-child(2) { animation-delay: 0.3s; }
        .loading-wrap img:nth-child(3) { animation-delay: 0.6s; }
        .loading-wrap img:nth-child(4) { animation-delay: 0.9s; }
        .is-complete .loading-overlay { opacity: 0; visibility: hidden; }
        .is-complete .header-info { opacity: 1; }

        /* 컨텐츠 영역 */
        .project-content {
            width: 100%; display: flex; flex-direction: column; align-items: center;
            opacity: 0; transition: opacity 1s ease 0.5s; padding-top: 150px; /* 라벨이 빠진 만큼 여백 소폭 조정 */
        }
        .is-complete .project-content { opacity: 1; }
        .img-wrapper { width: 100%; 
    max-width: 1200px; 
    margin: 0 auto; /* ★ 좌우 여백을 자동으로 채워 중앙으로 보냅니다 */
    position: relative; 
    line-height: 0; }
        .img-wrapper img { width: 100%; max-width: 1200px; position: relative; line-height: 0; }
        
        /* 이미지 보호막 (우클릭 방지) */
        .img-wrapper::after { 
            content: ''; position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; z-index: 10; background: rgba(0,0,0,0); 
        }
    </style>
</head>
<body class="is-loading" oncontextmenu="return false">

        <div class="img-wrapper"><img src="jma7.jpg" alt="Detail 01"></div>
        <div class="img-wrapper"><img src="jma8.jpg" alt="Detail 01"></div>
        <div class="img-wrapper"><img src="jma9.jpg" alt="Detail 01"></div>
        <div class="img-wrapper"><img src="jma10.jpg" alt="Detail 01"></div>
        <div class="img-wrapper"><img src="jma11.jpg" alt="Detail 01"></div>
        <div class="img-wrapper"><img src="jma12.jpg" alt="Detail 01"></div>
        <div class="img-wrapper"><img src="jma13.jpg" alt="Detail 01"></div>
        <div class="img-wrapper"><img src="jma14.jpg" alt="Detail 01"></div>
        <div class="img-wrapper"><img src="jma15.jpg" alt="Detail 01"></div>
        <div class="img-wrapper"><img src="jma16.jpg" alt="Detail 01"></div>

    <script>
        window.addEventListener('load', function() {
            setTimeout(() => { document.body.classList.replace('is-loading', 'is-complete'); }, 1500);
        });
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>

</html>
